# When a release is published on GitHub, build GuildMilestones.exe and the two zips and attach them to it.
name: Build release files
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the app
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GuildMilestones --icon assets/gm.ico --add-data "GuildMilestones;GuildMilestones" --add-data "assets;assets" --hidden-import tray milestone_gui.py
      - name: Build the zips
        run: python dev/make_release.py
      - name: Attach them to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/GuildMilestones.exe dist/GuildMilestones-*.zip --clobber
